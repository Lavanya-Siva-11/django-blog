{% extends 'blog/base.html' %}

{% block content %}
  <div class="container flex-grow-1 py-4">
    <h1 class="fw-semibold mb-4">{{ blog_title|upper }}</h1>
    {% if posts %}
    <div class="row row-cols-1 row-cols-md-2 g-4">
      {% for post in posts %}
        <div class="col">
          <div class="card flex-row p-3 h-100">
            <div class="flex-shrink-0 bg-secondary-subtle text-secondary d-flex align-items-center justify-content-center rounded overflow-hidden" style="width:100px;height:100px;">
              <img src="{{ post.img_url }}" alt="{{ post.title }}" style="width:100%;height:100%;object-fit:cover;">
            </div>
            <div class="card-body d-flex flex-column p-0 ps-3">
              <h3 class="h6 fw-bold">{{ post.title }}</h3>
              <p class="small text-muted mb-2">{{ post.content  | truncatechars:100}}</p>
              <div class="mt-auto d-flex justify-content-between align-items-center small">
                <a href="{% url 'detailWithId' slug=post.slug %}" class="link-primary text-decoration-none">Read More</a>
                {% comment %} <span class="fw-bold">Sports</span> {% endcomment %}
              </div>
            </div>
          </div>
        </div>
      {% endfor %}
    </div>

    {% else %}
    <p>No posts available Yet.</p>

    {% endif %} 
  </div>
{% endblock %}
