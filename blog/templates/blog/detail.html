{% extends 'blog/base.html' %}

{% block content %}
<div class="container flex-grow-1 py-5">
    <div class="row g-4">

      <!-- Post content -->
      <article class="col-lg-8">
        <h1 class="display-5 fw-bold">{{post.title}}</h1>
        <p class="text-muted mb-4">Posted on January 1, 2024</p>

        <div class="ratio ratio-21x9 bg-secondary-subtle text-secondary d-flex align-items-center justify-content-center fs-1 fw-medium rounded mb-4">
          <span style="text-align: center; margin-top:5rem;">800 x 400</span>
        </div>

        <div class="lh-lg">
          <p>{{post.content}}</p>
        </div>
      </article>

      <!-- Sidebar -->
      <aside class="col-lg-4">
        <div class="card">
          <div class="card-body">
            <h2 class="card-title h5 fw-bold mb-3">Related Posts</h2>
            <ul class="list-unstyled mb-0">
              <li class="mb-2"><a href="#" class="link-primary text-decoration-underline">Post 1</a></li>
              <li class="mb-2"><a href="#" class="link-primary text-decoration-underline">Post 2</a></li>
              <li class="mb-0"><a href="#" class="link-primary text-decoration-underline">Post 3</a></li>
            </ul>
          </div>
        </div>
      </aside>

    </div>
</div>
{% endblock %}
